    /* Ensure the outer container uses dynamic viewport height */
.chat-container {
  display: flex;
  flex-direction: column;
  height: 100dvh; /* 'dvh' adapts dynamically when mobile keyboards open */
  overflow: hidden;
}

/* Messages area scrolls smoothly */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; /* Prevents laggy scrolling on iPhones */
  padding: 15px;
}

/* Keep the input area pinned to the bottom */
.chat-input-area {
  position: sticky;
  bottom: 0;
  width: 100%;
  background-color: #ffffff;
  padding: 10px;
  box-sizing: border-box;
}

/* Stop mobile browsers from zooming in auto-magically on inputs */
input, textarea {
  font-size: 16px !important; /* Font size under 16px causes auto-zoom lag on iOS */

  
}



/* Lock the page so nothing overflows off-screen */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

/* Outer main container */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100dvh; /* Adapts dynamically to mobile viewports */
  max-height: 100%;
}

/* Middle message area - takes all available space */
.chat-messages {
  flex: 1;
  overflow-y: auto; /* Allow scrolling ONLY inside the message area */
  -webkit-overflow-scrolling: touch;
  padding: 15px;
}

/* Input area - firmly pinned to the bottom */
.chat-input-area {
  flex-shrink: 0; /* Prevents the input box from collapsing or getting pushed down */
  position: relative;
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  background-color: #1e1e1e; /* Match your dark theme background */
}


/* Fixes inverted text on all text inputs and textareas */
input[type="text"],
input[type="search"],
input:not([type]),
textarea {
    direction: ltr !important;
    unicode-bidi: normal !important;
    text-align: left !important;
}

    function applyLanguageLocalization() {
        const lang = document.getElementById('lang-selector').value;
        const pack = languagePack[lang] || languagePack.English;
        const container = document.getElementById('chat-container');
        
        container.className = "";
        container.removeAttribute("data-lang");

        // 🎯 THE 7 TYPOGRAPHIC SECTOR MATCHERS
        if (["Hindi", "Marathi", "Punjabi"].includes(lang)) {
            container.classList.add("script-north-shirorekha");
        } else if (["Bengali", "Assamese"].includes(lang)) {
            container.classList.add("script-east-sharps");
        } else if (lang === "Odia") {
            container.classList.add("script-odia-supreme");
        } else if (lang === "Gujarati") {
            container.classList.add("script-gujarati-elastic");
        } else if (lang === "Telugu") {
            container.classList.add("script-telugu-carved");
        } else if (lang === "Kannada") {
            container.classList.add("script-kannada-top");
        } else if (["Tamil", "Malayalam"].includes(lang)) {
            container.classList.add("script-south-flat");
            if(lang === "Malayalam") container.setAttribute("data-lang", "Malayalam");
        }
        
        // Dynamic localized string insertion across elements
        document.getElementById('lbl-sidebar-title').innerText = pack.sidebar || languagePack.English.sidebar;
        document.getElementById('user-input').placeholder = pack.placeholder || languagePack.English.placeholder;
        document.getElementById('send-btn').innerText = pack.send || languagePack.English.send;
        document.getElementById('stop-btn').innerText = pack.stop || languagePack.English.stop;
    }

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    const previewDeck = document.getElementById('preview-deck');
    const menuPopover = document.getElementById('menu-popover');
    const linkModal = document.getElementById('link-modal');
    const cameraModal = document.getElementById('camera-modal');
    const webcamFeed = document.getElementById('webcam-feed');
    const historyTimelineBox = document.getElementById('history-timeline-box');
    const chipContextPopover = document.getElementById('chip-context-popover');
    const shareHubModal = document.getElementById('share-hub-modal');
    const sidebarElement = document.getElementById('sidebar');
    
    let activeFile = null;
    let attachedLinks = [];
    let abortController = null;
    let recognition = null;
    let isRecording = false;
    let localStream = null;
    
    let selectedChipId = null;
    let selectedChipData = null;

    window.addEventListener('DOMContentLoaded', fetchHistoryLogArchives);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    document.addEventListener('click', (e) => { 
        menuPopover.style.display = 'none';
        if (!e.target.classList.contains('chip-trigger-btn')) {
            chipContextPopover.style.display = 'none';
        }
    });

    function toggleSidebar() {
        sidebarElement.classList.toggle('open');
    }

    function toggleMenu(e) { e.stopPropagation(); menuPopover.style.display = menuPopover.style.display === 'block' ? 'none' : 'block'; }
    function triggerFilePicker(type) { document.getElementById('gallery-input').click(); }
    function handleFileSelect(event) { const file = event.target.files[0]; if (!file) return; activeFile = file; renderPreviews(); }
    
    async function openLiveCamera() {
        cameraModal.style.display = 'flex';
        try { localStream = await navigator.mediaDevices.getUserMedia({ video: true }); webcamFeed.srcObject = localStream; }
        catch (err) { alert("Camera system blocked."); closeLiveCamera(); }
    }
    function closeLiveCamera() { cameraModal.style.display = 'none'; if (localStream) localStream.getTracks().forEach(t => t.stop()); }
    function captureSnapshot() {
        const canvas = document.createElement('canvas'); canvas.width = webcamFeed.videoWidth || 640; canvas.height = webcamFeed.videoHeight || 480;
        canvas.getContext('2d').drawImage(webcamFeed, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => { activeFile = new File([blob], "camera.png", { type: "image/png" }); renderPreviews(); closeLiveCamera(); }, 'image/png');
    }

    function openLinkModal() { linkModal.style.display = 'flex'; }
    function closeLinkModal() { linkModal.style.display = 'none'; }
    function saveLinks() {
        const inputs = document.querySelectorAll('.link-input-field'); attachedLinks = [];
        inputs.forEach(i => { if (i.value.trim()) attachedLinks.push(i.value.trim()); });
        closeLinkModal(); renderPreviews();
    }

    function renderPreviews() {
        previewDeck.innerHTML = '';
        if (activeFile) {
            const div = document.createElement('div'); div.classList.add('media-preview');
            const img = document.createElement('img'); img.src = URL.createObjectURL(activeFile);
            const btn = document.createElement('button'); btn.innerText = '×'; btn.classList.add('remove-badge');
            btn.onclick = () => { activeFile = null; renderPreviews(); };
            div.append(img, btn); previewDeck.appendChild(div);
        }
    }

    function toggleVoice() {
        if (isRecording) { recognition.stop(); return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;
        recognition = new SpeechRecognition();
        const currentLang = document.getElementById('lang-selector').value;
        const speechMap = { English: 'en-IN', Hindi: 'hi-IN', Odia: 'or-IN' };
        recognition.lang = speechMap[currentLang] || 'en-IN';
        recognition.onstart = () => { isRecording = true; document.getElementById('voice-btn').classList.add('recording'); };
        recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; };
        recognition.onend = () => { isRecording = false; document.getElementById('voice-btn').classList.remove('recording'); };
        recognition.start();
    }

    function stopResponse() { if (abortController) { abortController.abort(); sendBtn.style.display = 'inline-flex'; stopBtn.style.display = 'none'; } }

   async function fetchHistoryLogArchives() {
        try {
            const response = await fetch('/history');
            const data = await response.json();
            historyTimelineBox.innerHTML = '';
            
            data.forEach(item => {
                const chip = document.createElement('div');
                chip.classList.add('history-chip');
                
                // 🛡️ Safe Event Mapping without messy inline string replacements
                chip.addEventListener('click', (event) => {
                    loadSavedChatContextToScreen(event, item.prompt, item.response, item.language);
                });
                
                chip.innerHTML = `
                    <div class="chip-body">
                        <span class="chip-text"></span>
                        <div class="chip-meta">🌐 ${item.language}</div>
                    </div>
                    <button class="chip-trigger-btn">⋮</button>
                `;
                
                // Safely set text context to prevent quote escaping crashes
                chip.querySelector('.chip-text').innerText = item.prompt;
                
                // Attach the 3-dot trigger context click event cleanly
                const triggerBtn = chip.querySelector('.chip-trigger-btn');
                triggerBtn.addEventListener('click', (event) => {
                    openContextMenu(event, item.id, item.prompt, item.response);
                });
                
                historyTimelineBox.appendChild(chip);
            });
        } catch(err) { console.error("Database connectivity error:", err); }
    }


    function loadSavedChatContextToScreen(event, prompt, response, language) {
        if (event.target.classList.contains('chip-trigger-btn')) return;
        
        chatBox.innerHTML = '';
        document.getElementById('lang-selector').value = language;
        applyLanguageLocalization();
        appendMessage(prompt, 'user');
        appendMessage(response, 'bot');
        
        if(window.innerWidth < 1024) toggleSidebar();
    }

   function openContextMenu(event, id, prompt, response) {
        event.stopPropagation(); // Prevents clicking the row background instead
        selectedChipId = id;
        selectedChipData = { prompt: prompt, response: response };
        
        // Precise layout positioning right next to where your mouse clicked
        chipContextPopover.style.top = `${event.clientY + 10}px`;
        chipContextPopover.style.left = `${event.clientX - 130}px`;
        chipContextPopover.style.display = 'block';
    }

   async function triggerItemDelete() {
    if(!selectedChipId) return;
    try {
        const response = await fetch(`/history/delete/${selectedChipId}`, { method: 'DELETE' });
        if(response.ok) {
            fetchHistoryLogArchives();
            chatBox.innerHTML = '';
            chipContextPopover.style.display = 'none';
        }
    } catch(err) { console.error(err); }
}
    function startFreshNewChatSession() {
        chatBox.innerHTML = '';
        userInput.value = '';
        previewDeck.innerHTML = '';
        if(window.innerWidth < 1024) toggleSidebar();
    }

    function triggerShareModal() {
        if(!selectedChipData) return;
        chipContextPopover.style.display = 'none';
        shareHubModal.style.display = 'flex';
        
        const shareText = encodeURIComponent(`Prompt: "${selectedChipData.prompt}"\nResponse: "${selectedChipData.response}"`);
        // Generate a public link mock or direct reference pointing to this item instance ID
        const generatedLink = `${window.location.origin}/share/context/${selectedChipId}`;
        const shareUrl = encodeURIComponent(generatedLink);

        // Populate your copy to clipboard interface field input text
        document.getElementById('share-link-copy-field').value = generatedLink;

        // Map live system intent configurations
        document.getElementById('share-wa').href = `https://api.whatsapp.com/send?text=${shareText}%20${shareUrl}`;
        document.getElementById('share-tg').href = `https://telegram.me/share/url?url=${shareUrl}&text=${shareText}`;
        document.getElementById('share-x').href = `https://x.com/intent/tweet?text=${shareText}`;
        document.getElementById('share-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
        document.getElementById('share-insta').href = `https://instagram.com`; 
        document.getElementById('share-rd').href = `https://www.reddit.com/submit?title=AI_Insight&text=${shareText}%20${shareUrl}`;
        document.getElementById('share-gmail').href = `https://mail.google.com/mail/?view=cm&fs=1&su=AI_Insight_Log&body=${shareText}%20${shareUrl}`;
    }

    function copyShareLinkToClipboard() {
        const copyField = document.getElementById('share-link-copy-field');
        copyField.select();
        copyField.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyField.value);
        alert("Link successfully captured to your system clipboard!");
    }
    function closeShareModal() { shareHubModal.style.display = 'none'; }

   async function sendMessage() {
        const text = userInput.value.trim();
        const selectedLang = document.getElementById('lang-selector').value;
        if (!text && !activeFile && attachedLinks.length === 0) return;

        appendMessage(text || "[Attached Media Data]", 'user');
        userInput.value = ''; previewDeck.innerHTML = '';
        sendBtn.style.display = 'none'; stopBtn.style.display = 'inline-flex';
        
        // ⏳ Inject the animated loader layout component instead of raw text strings
        const loaderHtml = `<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
        const loaderId = appendMessage(loaderHtml, 'bot');
        // Convert plain text to HTML explicitly to render the dots properly
        document.getElementById(loaderId).querySelector('.message').innerHTML = loaderHtml;
        
        abortController = new AbortController();
        const formData = new FormData();
        formData.append('message', text);
        formData.append('language', selectedLang); 
        if (activeFile) formData.append('file', activeFile);

        try {
            const response = await fetch('/chat', { method: 'POST', body: formData, signal: abortController.signal });
            document.getElementById(loaderId).remove();

            const streamingMsgId = appendMessage("", 'bot');
            const streamingBubble = document.getElementById(streamingMsgId).querySelector('.message');
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let done = false;

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                    streamingBubble.innerText += decoder.decode(value, { stream: !done });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
            fetchHistoryLogArchives();

        } catch (e) {
            if (document.getElementById(loaderId)) document.getElementById(loaderId).remove();
            if (e.name === 'AbortError') appendMessage("❌ Terminated.", 'bot');
            else appendMessage("Connection drop.", 'bot');
        } finally {
            activeFile = null; attachedLinks = []; sendBtn.style.display = 'inline-flex'; stopBtn.style.display = 'none';
        }
    }

   function appendMessage(text, sender) {
        const uniqueId = 'msg-' + Math.random().toString(36).substr(2, 9);
        const wrapper = document.createElement('div'); wrapper.classList.add('message-wrapper', sender.includes('user') ? 'user-wrapper' : 'bot-wrapper'); wrapper.id = uniqueId;
        const msgDiv = document.createElement('div'); msgDiv.classList.add('message', sender.split(' ')[0]); msgDiv.innerText = text;
        
        // 📋 RESPONSE COPY ENGINE: Right-click or double-click copy trigger configuration
        msgDiv.style.cursor = 'pointer';
        msgDiv.title = 'Double click to copy this response text directly!';
        msgDiv.addEventListener('dblclick', () => {
            navigator.clipboard.writeText(msgDiv.innerText);
            alert("Response block cleanly copied to your system clipboard!");
        });

        wrapper.appendChild(msgDiv); chatBox.appendChild(wrapper); chatBox.scrollTop = chatBox.scrollHeight; return uniqueId;
    }
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
