    function applyLoginLocalization() {
        const lang = document.getElementById('lang-selector').value;
        const pack = loginLanguagePack[lang] || loginLanguagePack.English;
        const card = document.getElementById('main-card');
        
        card.className = "login-card";
        card.removeAttribute("data-lang");

        if (["Hindi", "Marathi", "Punjabi"].includes(lang)) {
            card.classList.add("script-north-shirorekha");
        } else if (["Bengali", "Assamese"].includes(lang)) {
            card.classList.add("script-east-sharps");
        } else if (lang === "Odia") {
            card.classList.add("script-odia-supreme");
        } else if (lang === "Gujarati") {
            card.classList.add("script-gujarati-elastic");
        } else if (lang === "Telugu") {
            card.classList.add("script-telugu-carved");
        } else if (lang === "Kannada") {
            card.classList.add("script-kannada-top");
        } else if (["Tamil", "Malayalam"].includes(lang)) {
            card.classList.add("script-south-flat");
            if(lang === "Malayalam") card.setAttribute("data-lang", "Malayalam");
        }
        
        document.getElementById('lbl-main-title').innerText = pack.title;
        document.getElementById('lbl-subtitle').innerText = pack.subtitle;
        document.getElementById('lbl-username').innerText = pack.user;
        document.getElementById('input-user').placeholder = pack.userPlh;
        document.getElementById('lbl-password').innerText = pack.pass;
        document.getElementById('input-pass').placeholder = pack.passPlh;
        document.getElementById('lbl-auth-btn').innerText = pack.auth;
        document.getElementById('lbl-social-title').innerText = pack.social;
        document.getElementById('lbl-google').innerText = pack.google;
        document.getElementById('lbl-meta').innerText = pack.meta;
        document.getElementById('lbl-x').innerText = pack.x;
        document.getElementById('lbl-apple').innerText = pack.apple;
    }

    function enterWorkspace() { window.location.href = '/workspace'; }
    function simulateOAuth(provider) {
        alert("Initializing structural secure OAuth2 handshake with " + provider + ".\nSyncing token keys to your local D drive container...");
        window.location.href = '/workspace';
    }
